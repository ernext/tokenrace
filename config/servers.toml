# Server preconfigurati di TokenRace.
#
# Per aggiungere un server basta un nuovo blocco [[server]]:
#   id         identificativo breve; la nota tradotta sta in locales/*.toml, sezione [server_notes]
#   name       nome mostrato nel selettore
#   url        URL base dell'API compatibile OpenAI (di solito termina con /v1)
#   start      comando di avvio mostrato sotto il selettore (vuoto se si avvia da un'app)
#   no_reasoning         campi aggiunti alla richiesta con "Senza ragionamento"
#                        (se manca si usa [no_reasoning_default])
#   no_reasoning_tested  true se il parametro è stato verificato con questo server

[no_reasoning_default]
# Convenzione dei server basati su llama.cpp, MLX, vLLM e SGLang
fields = { chat_template_kwargs = { enable_thinking = false } }
tested = false

# --- Mac Apple Silicon (MLX) e app desktop --------------------------------

[[server]]
id = "ollama"
name = "Ollama"
url = "http://localhost:11434/v1"
start = "ollama serve"
no_reasoning = { reasoning_effort = "none" }
no_reasoning_tested = true

[[server]]
id = "lmstudio"
name = "LM Studio"
url = "http://localhost:1234/v1"
start = "lms server start && lms load <model>"
no_reasoning = { reasoning_effort = "none", chat_template_kwargs = { enable_thinking = false } }
no_reasoning_tested = true

[[server]]
id = "rapidmlx"
name = "Rapid-MLX"
url = "http://localhost:7659/v1"
start = "rapid-mlx serve <model> --port 8000"

[[server]]
id = "omlx"
name = "oMLX"
url = "http://localhost:8000/v1"
start = ""

[[server]]
id = "mlxlm"
name = "mlx_lm.server"
url = "http://localhost:8080/v1"
start = "mlx_lm.server --model <model> --port 8080"

# --- Multipiattaforma ------------------------------------------------------

[[server]]
id = "llamacpp"
name = "llama.cpp (llama-server)"
url = "http://localhost:8080/v1"
start = "llama-server -m <file.gguf> --port 8080"

[[server]]
id = "vllm"
name = "vLLM"
url = "http://localhost:8000/v1"
start = "vllm serve <model>"

[[server]]
id = "sglang"
name = "SGLang"
url = "http://localhost:30000/v1"
start = "python -m sglang.launch_server --model-path <model>"

[[server]]
id = "lemonade"
name = "Lemonade"
url = "http://localhost:13305/api/v1"
start = "lemonade-server serve"

[[server]]
id = "dockermr"
name = "Docker Model Runner"
url = "http://localhost:12434/engines/v1"
start = "docker desktop enable model-runner --tcp 12434"

[[server]]
id = "unsloth"
name = "Unsloth Studio"
url = "http://localhost:8888/v1"
start = "unsloth run --model <model>"

[[server]]
id = "localai"
name = "LocalAI"
url = "http://localhost:8080/v1"
start = "local-ai run <model>"

[[server]]
id = "jan"
name = "Jan"
url = "http://localhost:1337/v1"
start = ""

[[server]]
id = "koboldcpp"
name = "KoboldCpp"
url = "http://localhost:5001/v1"
start = "koboldcpp --model <file.gguf>"

[[server]]
id = "textgen"
name = "text-generation-webui"
url = "http://localhost:5000/v1"
start = ""
no_reasoning = { enable_thinking = false }
no_reasoning_tested = false
