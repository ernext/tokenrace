# English UI strings.
# To add a language: copy this file as <code>.toml, translate it
# and add the code to config/defaults.toml → [ui] languages.
# {n}, {server} and similar are placeholders: keep them as they are.

[meta]
name = "English"
flag = "🇬🇧"

[app]
tagline = "Benchmark for local LLM servers · same measuring code for all"
servers_pill = "{n} servers"
footer = "open source, MIT license"

[section]
server = "🖥️ Server and model"
prompt = "📝 Prompt and parameters"
response = "💬 Streaming response"
live = "⏱️ Live metrics"
results = "📊 Session results"

[label]
language = "Language"
server = "Server"
url = "Base URL"
api_key = "API key"
model = "Model"
model_placeholder = "Press «Refresh models»"
refresh = "🔄 Refresh models"
start_cmd = "Start"
preset = "Preset prompt"
prompt = "Prompt text"
temperature = "Temperature"
seed = "Seed"
max_tokens = "Max tokens"
repetitions = "Runs"
start = "▶️ Start test"
stop = "⏹️ Stop"
no_reasoning = "No reasoning"
summary = "**Summary** · median excludes the cold run; min and max over all runs"
chart = "**Median effective speed by server and model** (tok/s)"
chart_axis = "Server and model"
all_runs = "All runs"
download = "⬇️ Download CSV"
clear = "🗑️ Clear results"
reasoning = "Reasoning"

[preset]
short = "Short"
long = "Long"
cache = "Cache"

[preset_descr]
short = "short prompt, long answer, unique ID on every run"
long = "≈8,000 tokens of context, short answer, unique ID on every run"
cache = "same long prompt, identical on every run (measures the cache)"
token_estimate = "estimated prompt tokens ≈ {n} (characters / 4)"

[stat]
median = "median"
min = "min"
max = "max"

[metric]
ttft = "TTFT (s)"
chunks = "Chunks received"
elapsed = "Elapsed (s)"
gen = "Gen. (tok/s)"
eff = "Effective (tok/s)"
total = "Total (s)"
tokens_io = "Tokens in/out"
prompt_speed = "Prompt (tok/s)"
split = "Reason./answer"
ram_before = "RAM before (GB)"
ram_peak = "RAM peak (GB)"

[msg]
run_status = "Run {i}/{n}"
cold = " · cold"
in_progress = "in progress"
completed = "completed"
ram_note = "RAM = memory in use on the whole system, not just the server."
estimated = "⚠️ Estimated count: the server sent no usage, tokens counted from chunks."
reasoning_still = "⚠️ Reasoning still on: this server or model ignored the request."
split_estimated = "Reasoning/answer split estimated from chunks (the server does not provide it)."
stopped = "Test stopped. Completed runs have been saved."
no_results = "No results yet. Pick a server and model, then press «Start test»."
need_two = "At least 2 runs are needed to compute the median."
response_placeholder = "The model's answer will appear here during the test."
live_placeholder = "The metrics of each run will appear here."
no_models = "The server is running but has no models available."
nr_sends = "No reasoning → sends `{fields}` · {state}"
nr_tested = "tested with this server"
nr_untested = "not yet tested with this server"
nr_help_suffix = "For {server} it sends: `{fields}`"

[err]
connect = "Cannot connect to {url}. Is the server running?"
timeout = "The server {url} is not responding (timeout)."
read_timeout = "Timed out waiting for the server's response."
auth = "Access denied (HTTP {status}): a valid API key is needed, or another program is answering on this port."
http = "HTTP error {status}: {detail}"
http_other_program = "HTTP error {status}: another program is answering on this port, or the URL is wrong."
not_json = "Invalid response from /models: another program is answering on this port, or the URL is wrong."
server = "Server error: {detail}"
no_tokens = "The server returned no tokens."

[help]
language = "Language of the interface and of the preset prompts."
server = "The program that runs the model. Start it yourself before the test: the command is shown below."
url = "Address of the server's OpenAI-compatible API, usually ending in /v1."
api_key = "Optional. Only needed if the server requires it (e.g. Rapid-MLX Desktop, Jan, Unsloth Studio, or vLLM started with --api-key)."
model = "The model to test, read from the server with GET /models."
refresh = "Asks the server for the list of available models."
preset = "Short: long answer. Long: ≈8,000 tokens of context. Cache: long prompt, identical on every run."
prompt = "The text sent to the model. You can edit it freely."
temperature = "Randomness of the answer. 0 = most repeatable, recommended for tests."
seed = "Fixed number to make answers reproducible, if the server supports it."
max_tokens = "Maximum number of tokens the model may generate."
repetitions = "How many times to repeat the test. The first run is «cold» and excluded from the median."
start = "Starts the runs on the selected server and model."
stop = "Stops the test. Completed runs are kept."
no_reasoning = "Asks the server not to reason, using the right parameter for each server. Some models reason anyway: a warning appears in that case."
ttft = "Time To First Token: seconds from sending the request to the first token received."
gen = "Pure generation speed: (output tokens − 1) / (last token − first token)."
eff = "Speed as the user sees it, initial wait included: output tokens / (last token − request sent)."
total = "Seconds from sending the request to the end of the stream."
chunks = "Text pieces received so far; roughly one token each."
elapsed = "Seconds since the request was sent."
tokens_io = "Prompt tokens (input) and generated tokens (output), from usage."
prompt_speed = "Prompt processing speed, estimate: input tokens / TTFT. Also includes latency and model loading."
split = "Reasoning / answer: tokens spent reasoning and tokens of the actual answer."
ram_before = "RAM in use on the whole system right before the request."
ram_peak = "Highest RAM in use on the whole system during the request (sampled every 0.5 s)."
download = "Downloads every run of this session as a CSV file."
clear = "Clears this session's results."

# Column names (tables and CSV)
[col]
ts = "Date and time"
server = "Server"
url = "URL"
model = "Model"
prompt_type = "Prompt type"
prompt_lang = "Prompt language"
run = "Run"
cold = "Cold"
temperature = "Temperature"
seed = "Seed"
max_tokens = "Max tokens"
repetitions = "Runs"
no_reasoning = "Reasoning off"
no_reasoning_fields = "No-reasoning parameter"
ttft = "TTFT (s)"
tok_s_gen = "Generation (tok/s)"
tok_s_eff = "Effective speed (tok/s)"
total = "Total time (s)"
tok_in = "Input tokens"
tok_out = "Output tokens"
tok_reason = "Reasoning tokens"
tok_answer = "Answer tokens"
prompt_tok_s = "Est. prompt processing (tok/s)"
ram_before = "System RAM before (GB)"
ram_peak = "System RAM peak (GB)"
estimated = "Estimated count"
split_estimated = "Reasoning/answer estimated"

# Column explanations (? icon in tables)
[colhelp]
cold = "First run of the test: excluded from the median."
tok_in = "Prompt tokens."
tok_out = "Generated tokens (reasoning + answer)."
tok_reason = "Tokens spent reasoning."
tok_answer = "Tokens of the actual answer."
estimated = "True if the server sent no usage and tokens were counted from chunks."
split_estimated = "True if the reasoning/answer split was estimated from chunks."

