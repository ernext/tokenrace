nr_tested = "provato con questo server"
nr_untested = "non ancora provato con questo server"
nr_help_suffix = "Per {server} invia: `{fields}`"

[err]
connect = "Impossibile connettersi a {url}. Il server è avviato?"
timeout = "Il server {url} non risponde (timeout)."
read_timeout = "Timeout in attesa della risposta del server."
auth = "Accesso negato (HTTP {status}): serve una API key valida, oppure sulla porta risponde un altro programma."
http = "Errore HTTP {status}: {detail}"
http_other_program = "Errore HTTP {status}: sulla porta risponde un altro programma o l'URL non è corretto."
not_json = "Risposta non valida da /models: sulla porta risponde un altro programma o l'URL non è corretto."
server = "Errore dal server: {detail}"
no_tokens = "Il server non ha restituito alcun token."

[help]
language = "Lingua dell'interfaccia e dei prompt pronti."
server = "Il programma che esegue il modello. Va avviato a mano prima del test: il comando è indicato sotto."
url = "Indirizzo delle API compatibili OpenAI del server, di solito termina con /v1."
api_key = "Facoltativa. Serve solo se il server la richiede (es. Rapid-MLX Desktop, oMLX, Jan, Unsloth Studio, o vLLM avviato con --api-key)."
model = "Il modello da provare, letto dal server con GET /models."
refresh = "Chiede al server l'elenco dei modelli disponibili."
preset = "Breve: risposta lunga. Lungo: ≈8.000 token di contesto. Cache: prompt lungo identico a ogni ripetizione."
prompt = "Il testo inviato al modello. Puoi modificarlo liberamente."
temperature = "Casualità della risposta. 0 = la più ripetibile, consigliata per i test."
seed = "Numero fisso per rendere le risposte riproducibili, se il server lo supporta."
max_tokens = "Numero massimo di token che il modello può generare."
repetitions = "Quante volte ripetere la prova. La prima è «a freddo» ed esclusa dalla mediana."
start = "Avvia le ripetizioni sul server e modello scelti."
stop = "Interrompe il test. Le ripetizioni già completate restano salvate."
no_reasoning = "Chiede al server di non ragionare, con il parametro adatto a ciascun server. Alcuni modelli ragionano comunque: in quel caso compare un avviso."
ttft = "Time To First Token: secondi dall'invio della richiesta al primo token ricevuto, ragionamento incluso."
gen = "Velocità di generazione pura: (token output − 1) / (ultimo token − primo token)."
eff = "Velocità vista dall'utente, attesa iniziale inclusa: token output / (ultimo token − invio)."
total = "Secondi dall'invio della richiesta alla fine dello streaming."
chunks = "Pezzi di testo ricevuti finora; circa un token ciascuno."
elapsed = "Secondi dall'invio della richiesta."
tokens_io = "Token del prompt (input) e token generati (output), da usage."
prompt_speed = "Velocità di elaborazione del prompt, stima: token input / TTFT. Include anche latenza e caricamento del modello."
split = "Ragionamento / risposta: token spesi a ragionare e token della risposta vera e propria."
ram_before = "RAM in uso nell'intero sistema subito prima della richiesta."
ram_peak = "RAM massima in uso nell'intero sistema durante la richiesta (campionata ogni 0,5 s)."
ttft_answer = "Secondi dall'invio della richiesta al primo token della risposta visibile, ragionamento escluso. Vuoto se il modello ha solo ragionato."
visible = "Velocità della risposta visibile: token risposta / (ultimo token − invio). Il tempo di ragionamento conta come attesa. ≈ = token risposta stimati."
download = "Scarica tutte le ripetizioni della sessione in un file CSV."
clear = "Cancella lo storico dei risultati di questa sessione."

