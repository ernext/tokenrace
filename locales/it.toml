# Testi dell'interfaccia in italiano.
# Per aggiungere una lingua: copia questo file come <codice>.toml, traducilo
# e aggiungi il codice in config/defaults.toml → [ui] languages.
# {n}, {server} e simili sono segnaposto: lasciali come sono.

[meta]
name = "Italiano"
flag = "🇮🇹"

[app]
tagline = "Benchmark dei server LLM locali · stesso codice di misura per tutti"
servers_pill = "{n} server"
footer = "open source, licenza MIT"

[section]
server = "🖥️ Server e modello"
prompt = "📝 Prompt e parametri"
response = "💬 Risposta in streaming"
live = "⏱️ Misure in tempo reale"
results = "📊 Risultati della sessione"

[label]
language = "Lingua"
server = "Server"
url = "URL base"
api_key = "API key"
model = "Modello"
model_placeholder = "Premi «Aggiorna modelli»"
refresh = "🔄 Aggiorna modelli"
start_cmd = "Avvio"
preset = "Prompt pronto"
prompt = "Testo del prompt"
temperature = "Temperature"
seed = "Seed"
max_tokens = "Max tokens"
repetitions = "Ripetizioni"
start = "▶️ Avvia test"
stop = "⏹️ Ferma"
no_reasoning = "Senza ragionamento"
summary = "**Riepilogo** · mediana senza la ripetizione a freddo; min e max su tutte"
chart = "**Velocità effettiva mediana per server e modello** (tok/s)"
chart_axis = "Server e modello"
all_runs = "Tutte le ripetizioni"
download = "⬇️ Scarica CSV"
clear = "🗑️ Svuota risultati"
reasoning = "Ragionamento"

[preset]
short = "Breve"
long = "Lungo"
cache = "Cache"

[preset_descr]
short = "prompt corto, risposta lunga, ID univoco a ogni ripetizione"
long = "≈8.000 token di contesto, risposta breve, ID univoco a ogni ripetizione"
cache = "stesso prompt lungo, identico a ogni ripetizione (misura la cache)"
token_estimate = "stima token del prompt ≈ {n} (caratteri / 4)"

[stat]
median = "mediana"
min = "min"
max = "max"

[metric]
ttft = "TTFT (s)"
chunks = "Chunk ricevuti"
elapsed = "Trascorso (s)"
gen = "Gen. (tok/s)"
eff = "Effettiva (tok/s)"
total = "Totale (s)"
tokens_io = "Token in/out"
prompt_speed = "Prompt (tok/s)"
split = "Ragion./risp."
ram_before = "RAM prima (GB)"
ram_peak = "RAM picco (GB)"
ttft_answer = "TTFT risposta (s)"
visible = "Visibile (tok/s)"

[msg]
run_status = "Ripetizione {i}/{n}"
cold = " · a freddo"
in_progress = "in corso"
completed = "completata"
ram_note = "RAM = memoria in uso dell'intero sistema, non del solo server."
estimated = "⚠️ Conteggio stimato: il server non ha fornito usage, token contati dai chunk."
reasoning_still = "⚠️ Ragionamento ancora attivo: questo server o modello ha ignorato la richiesta."
split_estimated = "Divisione ragionamento/risposta stimata dai chunk (il server non la fornisce)."
stopped = "Test interrotto. Le ripetizioni completate sono state salvate."
no_results = "Nessun risultato ancora. Scegli server e modello, poi premi «Avvia test»."
need_two = "Servono almeno 2 ripetizioni per calcolare la mediana."
response_placeholder = "La risposta del modello comparirà qui durante il test."
live_placeholder = "Le misure di ogni ripetizione compariranno qui."
no_models = "Il server è attivo ma non ha modelli disponibili."
